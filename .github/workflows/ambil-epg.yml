name: Scraper EPG Otomatis 24/7

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari jam 07:00 WIB
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clone EPG Script Base
      uses: actions/checkout@v4
      with:
        repository: 'spyd3rking/tepg'
        ref: 'master'

    - name: Ambil Data Channel Pribadi
      uses: actions/checkout@v4
      with:
        path: 'my-config'

    - name: Sinkronisasi Berkas
      run: |
        cp my-config/channels.xml ./channels.xml
        mkdir -p public

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      # PERBAIKAN: Memastikan modul epg-grabber dari iptv-org terinstal dengan benar
      run: |
        npm install
        npm install -g @iptv-org/epg-grabber || true

    - name: Mulai Mengambil Data Jadwal TV
      # PERBAIKAN: Skrip akan otomatis membaca config channel starhub yang Anda buat di bawah
      run: npm run grab -- --channels=channels.xml --output=public/guide.xml --days=3

    # ==========================================
    # PROSES BARU: INTEGRASI JADWAL GMS CHANNEL
    # ==========================================
    
    # 1. Siapkan Python untuk menjalankan skrip pembuat EPG GMS
    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 2. Jalankan skrip Python untuk menyisipkan jadwal GMS ke public/guide.xml yang sudah ada
    - name: Gabungkan Jadwal GMS ke XML
      run: |
        python my-config/generate_epg.py

    # ==========================================

    # LANGKAH KHUSUS: Mengubah teks nama pembuat secara otomatis menggunakan perintah sed Linux
    - name: Tambahkan Nama Pembuat Kustom ke XML
      run: |
        sed -i 's|<tv|<tv generator-info-name="Generated by Spyderking"|g' public/guide.xml

    # LANGKAH BARU: Merapikan format XML (Pretty-Print) agar berbaris dan ada indentasi
    - name: Rapikan Format XML (Pretty Print)
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils
        xmllint --format public/guide.xml --output public/guide.xml

    # PERBAIKAN: Menyimpan semua hasil akhir ke repositori Anda
    - name: Simpan Hasil ke Repo
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd my-config
        git config --global user.name "Robot-EPG"
        git config --global user.email "bot@github.com"
        git config --local user.name "Robot-EPG"
        git config --local user.email "bot@github.com"
        
        cp ../public/guide.xml ./guide.xml
        
        git add guide.xml
        git commit -m "Update EPG otomatis harian + GMS Channel" || echo "Tidak ada perubahan jadwal"
        git push origin HEAD:${{ github.ref }}
