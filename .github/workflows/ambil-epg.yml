name: Scraper EPG Otomatis 24/7

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
    # 1. Unduh repositori scraper dari fork Anda (spyd3rking/tepg)
    - name: Clone EPG Script Base
      uses: actions/checkout@v4
      with:
        repository: 'spyd3rking/tepg'
        ref: 'master'

    # 2. Unduh isi repositori privat Anda ke folder sementara 'my-config'
    - name: Ambil Data Channel Pribadi
      uses: actions/checkout@v4
      with:
        path: 'my-config'

    # 3. Pindahkan berkas channels.xml ke root kerja utama agar terbaca oleh npm
    - name: Sinkronisasi Berkas
      run: |
        cp my-config/channels.xml ./channels.xml
        mkdir -p public

    # 4. Siapkan lingkungan kerja Node.js versi 24
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 5. Pasang modul-modul pendukung aplikasi
    - name: Install Dependencies
      run: npm install

    # 6. Jalankan pembuat EPG menggunakan perintah npm resmi bawaan repo
    - name: Mulai Mengambil Data Jadwal TV
      run: npm run grab -- --channels=channels.xml --output=public/guide.xml

    # 7. Kirim kembali berkas hasil jadi guide.xml ke dalam repositori privat Anda
    - name: Simpan Hasil ke Repo Private
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd my-config
        git config --global user.name "Robot-EPG"
        git config --global user.email "bot@github.com"
        
        # Salin dari folder public luar ke dalam folder repositori privat
        cp ../public/guide.xml ./guide.xml
        
        git add guide.xml
        git commit -m "Update EPG otomatis harian" || echo "Tidak ada perubahan jadwal"
        git push origin HEAD:${{ github.ref }}
