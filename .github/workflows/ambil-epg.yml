name: Scraper EPG Otomatis 24/7

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    steps:
    - name: Clone EPG Script
      uses: actions/checkout@v4
      with:
        repository: 'spyd3rking/tepg'
        ref: 'master'

    # Menggunakan path terpisah agar tidak tumpang tindih dengan file bawaan scraper
    - name: Ambil Data Channel Pribadi
      uses: actions/checkout@v4
      with:
        path: 'my-config'

    - name: Sinkronisasi File
      run: |
        # Memastikan file channels.xml disalin ke lokasi yang tepat untuk dibaca skrip
        cp my-config/channels.xml ./channels.xml
        mkdir -p public

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        # Mengubah ke Node 24 untuk menghilangkan pesan warning deprecated
        node-version: '24'

    - name: Install Dependencies
      run: npm install

    - name: Mulai Mengambil Data Jadwal TV
      # Menjalankan langsung menggunakan skrip utama agar bypass kendala versi node pada npm run
      run: node scripts/commands/epg/grab.js --channels=channels.xml --output=public/guide.xml

    - name: Simpan Hasil ke Repo Private
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd my-config
        git config --global user.name "Robot-EPG"
        git config --global user.email "bot@github.com"
        
        # Menyalin hasil jadinya kembali ke dalam repositori privat Anda
        cp ../public/guide.xml ./guide.xml
        
        git add guide.xml
        git commit -m "Update EPG otomatis harian" || echo "Tidak ada perubahan data jadwal"
        git push origin HEAD:${{ github.ref }}
