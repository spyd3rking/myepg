name: Scraper EPG Otomatis 24/7

on:
  schedule:
    - cron: '5 17 * * *' # Berjalan setiap hari jam 00:05 WIB (17:05 UTC)
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Clone EPG Script Base
      uses: actions/checkout@v4
      with:
        repository: 'spyd3rking/tepg'
        ref: 'master'

    - name: Ambil Data Channel Pribadi
      uses: actions/checkout@v4
      with:
        path: 'my-config'

    - name: Sinkronisasi Berkas
      run: |
        cp my-config/channels.xml ./channels.xml
        mkdir -p public

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm install

    - name: Mulai Mengambil Data Jadwal TV
      run: npm run grab -- --channels=channels.xml --output=public/guide.xml --days=3

    # LANGKAH KHUSUS: Mengubah teks nama pembuat secara otomatis menggunakan perintah sed Linux
    - name: Tambahkan Nama Pembuat Kustom ke XML
      run: |
        sed -i 's|<tv|<tv generator-info-name="Generated by Spyderking"|g' public/guide.xml

    # LANGKAH BARU: Merapikan format XML (Pretty-Print) agar berbaris dan ada indentasi
    - name: Rapikan Format XML (Pretty Print)
      run: |
        sudo apt-get update && sudo apt-get install -y libxml2-utils
        xmllint --format public/guide.xml --output public/guide.xml

    # PERBAIKAN: Dua baris nama langkah sebelumnya digabung di sini agar struktur YAML valid
    - name: Simpan Hasil ke Repo
      env:
        # Gunakan token bawaan GitHub Actions untuk otentikasi push
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd my-config
        git config --global user.name "Robot-EPG"
        git config --global user.email "bot@github.com"
        git config --local user.name "Robot-EPG"
        git config --local user.email "bot@github.com"
        
        cp ../public/guide.xml ./guide.xml
        
        git add guide.xml
        git commit -m "Update EPG otomatis harian" || echo "Tidak ada perubahan jadwal"
        git push origin HEAD:${{ github.ref }}
