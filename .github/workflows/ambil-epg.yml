name: Scraper EPG Otomatis 24/7

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari jam 07:00 WIB
  workflow_dispatch:

jobs:
  grab-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clone EPG Script Base
        uses: actions/checkout@v4
        with:
          repository: 'spyd3rking/tepg'
          ref: 'master'

      - name: Ambil Data Channel Pribadi
        uses: actions/checkout@v4
        with:
          path: 'my-config'

      - name: Sinkronisasi Berkas
        run: |
          cp my-config/channels.xml ./channels.xml
          mkdir -p public

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Mulai Mengambil Data Jadwal TV
        run: npm run grab -- --channels=channels.xml --output=public/guide.xml --days=3

      # =======================================================
      # PROSES BARU: UNDUH & FILTER JADWAL HBO SAJA DARI STARHUB
      # =======================================================
      
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unduh dan Sisipkan Saluran HBO Pilihan
        run: |
          python -c '
          import urllib.request
          import xml.etree.ElementTree as ET
          import os

          # 1. Unduh file master StarHub EPG yang berukuran besar ke memori sementara
          print("Mengunduh database StarHub...")
          url = "https://githubusercontent.com"
          urllib.request.urlretrieve(url, "starhub_temp.xml")

          # 2. Daftar ID Saluran HBO & Cinemax yang ingin diselamatkan/diambil
          target_channels = ["601", "603", "604", "605", "611"]

          # 3. Parse file utama guide.xml Anda dan file database StarHub
          guide_path = "public/guide.xml"
          if not os.path.exists(guide_path):
              # Jika file guide.xml belum terbentuk dari npm run grab, buat struktur XML dasar kosong
              root_guide = ET.Element("tv")
          else:
              tree_guide = ET.parse(guide_path)
              root_guide = tree_guide.getroot()

          tree_source = ET.parse("starhub_temp.xml")
          root_source = tree_source.getroot()

          # 4. Pindahkan elemen <channel> yang cocok ke file guide.xml Anda
          for channel in root_source.findall("channel"):
              if channel.get("id") in target_channels:
                  root_guide.append(channel)

          # 5. Pindahkan elemen <programme> (jadwal tayang) yang cocok ke file guide.xml Anda
          for programme in root_source.findall("programme"):
              if programme.get("channel") in target_channels:
                  root_guide.append(programme)

          # 6. Simpan kembali hasil penggabungan bersih ke public/guide.xml
          ET.indent(root_guide, space="  ", level=0)
          tree_output = ET.ElementTree(root_guide)
          tree_output.write(guide_path, encoding="utf-8", xml_declaration=True)
          print("Berhasil menyaring dan menggabungkan data saluran HBO ke guide.xml!")
          '

      # ==========================================
      # PROSES INTEGRASI JADWAL GMS CHANNEL
      # ==========================================

      # Jalankan skrip Python bawaan Anda untuk menyisipkan jadwal GMS ke public/guide.xml yang sekarang sudah berisi data HBO
      - name: Gabungkan Jadwal GMS ke XML
        run: |
          python my-config/generate_epg.py

      # ==========================================

      # LANGKAH KHUSUS: Mengubah teks nama pembuat secara otomatis menggunakan perintah sed Linux
      - name: Tambahkan Nama Pembuat Kustom ke XML
        run: |
          sed -i 's|<tv|<tv generator-info-name="Generated by Spyderking"|g' public/guide.xml

      # LANGKAH BARU: Merapikan format XML (Pretty-Print) agar berbaris dan ada indentasi
      - name: Rapikan Format XML (Pretty Print)
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          xmllint --format public/guide.xml --output public/guide.xml

      # PERBAIKAN: Menyimpan semua hasil akhir ke repositori Anda
      - name: Simpan Hasil ke Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd my-config
          git config --global user.name "Robot-EPG"
          git config --global user.email "bot@github.com"
          git config --local user.name "Robot-EPG"
          git config --local user.email "bot@github.com"
          
          cp ../public/guide.xml ./guide.xml
          
          git add guide.xml
          git commit -m "Update EPG otomatis harian + HBO + GMS Channel" || echo "Tidak ada perubahan jadwal"
          git push origin HEAD:${{ github.ref }}
